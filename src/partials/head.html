<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="keywords" content="{{ keywords }}">
<meta name="robots" content="{{ page.robots }}">
<meta name="author" content="{{ site.legalName }}">
<meta name="theme-color" content="#0a1a44">
<meta name="format-detection" content="telephone=no">
{{#if page.canonical}}<link rel="canonical" href="{{ page.canonical }}">
{{/if}}
<meta property="og:type" content="website">
<meta property="og:locale" content="es_ES">
<meta property="og:site_name" content="{{ site.brandName }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
{{#if page.ogUrl}}<meta property="og:url" content="{{ page.ogUrl }}">
{{/if}}
<meta property="og:image" content="{{ page.ogImage }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ site.brandName }} — {{ site.slogan }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="{{ page.ogImage }}">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/img/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/assets/img/icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{#if page.isHome}}<link rel="preconnect" href="https://images.unsplash.com">
{{/if}}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">
<script>
  /* Mejora progresiva: sin esta clase todo el contenido es visible. Si las animaciones
     no arrancan en 3 s (JS bloqueado o fallo de red), se retira y se muestra todo. */
  (function (d) {
    var r = d.documentElement;
    r.classList.add("js");
    setTimeout(function () { if (!window.__jmdAnim) r.classList.remove("js"); }, 3000);
  })(document);
</script>
